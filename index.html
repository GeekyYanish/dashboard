<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vellum · Registration Operations Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body data-palette="#C4451C,#00876B,#4F4FB5,#8F6207">

<!-- ─────────────────────────  icon sprite  ───────────────────────── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="i-rows" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><rect x="3" y="14" width="18" height="5" rx="1.5"/></symbol>
    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="18" rx="1.5"/><rect x="10" y="3" width="5" height="12" rx="1.5"/><rect x="17" y="3" width="4" height="16" rx="1.5"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 15l2 2 4-4"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M20 9V7a2 2 0 0 0-2-2H5a2 2 0 0 1 0-4h13"/><path d="M3 5v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M21 9v6h-5a3 3 0 0 1 0-6z"/></symbol>
    <symbol id="i-campus" viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M10 21v-6h4v6"/></symbol>
    <symbol id="i-team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 5.5a3 3 0 0 1 0 5.6"/><path d="M18.5 20a5.6 5.6 0 0 0-3-4.9"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.6M12 19.4V22M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2 12h2.6M19.4 12H22M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13.2A8.4 8.4 0 0 1 10.8 3 8.6 8.6 0 1 0 21 13.2z"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M8 5l7 7-7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v13M6.5 10.5L12 16l5.5-5.5"/><path d="M4 20h16"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.4l3.4 2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 1.8 20.5h20.4z"/><path d="M12 9.5v4.6M12 17.6v.1"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 7l9 6.4L21 7"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 22V3.5h13l-2.5 4.5L18 12.5H5"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M12.5 5.5 19 12l-6.5 6.5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H6M11.5 5.5 5 12l6.5 6.5"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H18a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 8h8M8 12h8M8 16h4"/></symbol>
    <symbol id="i-seat" viewBox="0 0 24 24"><path d="M6 10V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4"/><path d="M4 10h16v6H4z"/><path d="M6 16v4M18 16v4"/></symbol>
  </defs>
</svg>

<div class="grain" aria-hidden="true"></div>

<div class="app" id="app">

  <!-- ─────────────────────────  side rail  ───────────────────────── -->
  <aside class="rail" id="rail">
    <div class="rail__brand">
      <div class="mark" aria-hidden="true"><span>V</span></div>
      <div class="brand__text">
        <b>Vellum</b>
        <small>Registration Desk</small>
      </div>
      <button class="rail__collapse" id="railToggle" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg class="ic"><use href="#i-back"/></svg>
      </button>
    </div>

    <nav class="nav" id="nav" aria-label="Primary">
      <span class="nav__label">Operate</span>
      <button class="nav__item is-active" data-view="overview"><svg class="ic"><use href="#i-pulse"/></svg><span>Overview</span></button>
      <button class="nav__item" data-view="registrations"><svg class="ic"><use href="#i-rows"/></svg><span>Registrations</span><em class="nav__count" data-count="registrations"></em></button>
      <button class="nav__item" data-view="pipeline"><svg class="ic"><use href="#i-board"/></svg><span>Pipeline</span></button>
      <span class="nav__label">Verify &amp; Collect</span>
      <button class="nav__item" data-view="documents"><svg class="ic"><use href="#i-doc"/></svg><span>Documents</span><em class="nav__count" data-count="documents"></em></button>
      <button class="nav__item" data-view="payments"><svg class="ic"><use href="#i-wallet"/></svg><span>Fees &amp; Payments</span><em class="nav__count" data-count="payments"></em></button>
      <span class="nav__label">Plan</span>
      <button class="nav__item" data-view="programs"><svg class="ic"><use href="#i-campus"/></svg><span>Programs &amp; Seats</span></button>
      <button class="nav__item" data-view="team"><svg class="ic"><use href="#i-team"/></svg><span>Team &amp; SLA</span></button>
      <button class="nav__item" data-view="calendar"><svg class="ic"><use href="#i-cal"/></svg><span>Calendar</span></button>
    </nav>

    <div class="rail__foot">
      <button class="nav__item" data-view="settings"><svg class="ic"><use href="#i-cog"/></svg><span>Settings</span></button>
      <div class="who">
        <span class="avatar av-1">RA</span>
        <div class="who__text"><b>Reva Anand</b><small>Senior Registrar</small></div>
      </div>
    </div>
  </aside>

  <!-- ─────────────────────────  main column  ───────────────────────── -->
  <main class="main">
    <header class="topbar">
      <div class="topbar__left">
        <button class="icon-btn only-mobile" id="railOpen" aria-label="Open menu"><svg class="ic"><use href="#i-rows"/></svg></button>
        <div class="crumb">
          <h1 id="viewTitle">Overview</h1>
          <p id="viewSub">Autumn Term 2026 · window closes in 15 days</p>
        </div>
      </div>

      <div class="topbar__right">
        <button class="search-trigger" id="searchTrigger">
          <svg class="ic"><use href="#i-search"/></svg>
          <span>Search applicants, IDs, programs…</span>
          <kbd>⌘K</kbd>
        </button>

        <div class="term-pick n-inset">
          <select id="termSelect" aria-label="Academic term">
            <option>Autumn Term 2026</option>
            <option>Spring Term 2026</option>
            <option>Autumn Term 2025</option>
          </select>
          <svg class="ic ic-sm"><use href="#i-chev"/></svg>
        </div>

        <div class="bell-wrap">
          <button class="icon-btn" id="bellBtn" aria-label="Notifications"><svg class="ic"><use href="#i-bell"/></svg><i class="dot" id="bellDot"></i></button>
          <div class="pop n-raised" id="bellPop" hidden>
            <header>Alerts <button class="link" id="markRead">mark all read</button></header>
            <div id="alertList"></div>
          </div>
        </div>

        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
          <svg class="ic sun"><use href="#i-sun"/></svg>
          <svg class="ic moon"><use href="#i-moon"/></svg>
        </button>
      </div>
    </header>

    <div class="viewport" id="viewport"></div>
  </main>
</div>

<!-- ─────────────────────────  applicant drawer  ───────────────────────── -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Applicant detail"></aside>

<!-- ─────────────────────────  command palette  ───────────────────────── -->
<div class="cmdk" id="cmdk" hidden>
  <div class="cmdk__box n-raised">
    <div class="cmdk__input n-inset">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="cmdkInput" placeholder="Search applicants, jump to a view, run an action…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <div class="cmdk__results" id="cmdkResults"></div>
    <footer><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></footer>
  </div>
</div>

<!-- ─────────────────────────  modal + toasts  ───────────────────────── -->
<div class="modal" id="modal" hidden><div class="modal__box n-raised" id="modalBox"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="tip" id="tip" hidden></div>

<script src="app.js"></script>
</body>
</html>
